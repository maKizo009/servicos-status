<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor Ipiranga — Status dos Serviços</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --g900:#1B5E20;--g800:#2E7D32;--g700:#388E3C;--g600:#43A047;
  --g500:#4CAF50;--g400:#66BB6A;--g300:#81C784;--g200:#A5D6A7;--g100:#C8E6C9;--g50:#E8F5E9;
  --gold:#FFC107;--gold-l:#FFF8E1;--gold-d:#FF8F00;
  --red:#D32F2F;--red-l:#FFEBEE;--red-d:#B71C1C;
  --bg:#F5F5F0;--surface:#fff;--text:#1C1C1C;--text2:#5F6368;--text3:#9AA0A6;--border:#E0E0D8;
  --radius:16px;--radius-sm:10px;--shadow:0 2px 8px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);
  --shadow-lg:0 8px 30px rgba(0,0,0,.1);--font:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --transition:all .25s cubic-bezier(.4,0,.2,1)
}
html{font-size:16px;-webkit-font-smoothing:antialiased}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100dvh;display:flex;flex-direction:column}

/* ――― Header ――― */
.header{
  background:linear-gradient(135deg,var(--g900),var(--g800));
  padding:16px 24px;color:#fff;display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 2px 12px rgba(0,0,0,.15);position:relative;z-index:10
}
.header-left{display:flex;align-items:center;gap:14px}
.header-shield{
  width:40px;height:40px;background:rgba(255,255,255,.15);border-radius:50%;
  display:flex;align-items:center;justify-content:center;flex-shrink:0
}
.header-shield svg{width:24px;height:24px;fill:#fff}
.header-title{font-size:20px;font-weight:700;letter-spacing:-.3px}
.header-title span{font-weight:400;opacity:.8}
.header-right{display:flex;align-items:center;gap:16px}
.header-time{font-size:14px;font-variant-numeric:tabular-nums;opacity:.85}
.ov-dot{width:10px;height:10px;border-radius:50%;transition:var(--transition)}
.ov-dot.ok{background:var(--g400);box-shadow:0 0 8px var(--g400)}
.ov-dot.warn{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.ov-dot.critical{background:var(--red);box-shadow:0 0 8px var(--red)}

/* ――― Status Banner ――― */
.banner{
  margin:24px 24px 0;padding:24px 28px;border-radius:var(--radius);color:#fff;
  display:flex;align-items:center;gap:20px;box-shadow:var(--shadow);transition:var(--transition)
}
.banner.ok{background:linear-gradient(135deg,var(--g700),var(--g600))}
.banner.warn{background:linear-gradient(135deg,var(--gold-d),var(--gold))}
.banner.critical{background:linear-gradient(135deg,var(--red-d),var(--red))}
.banner-icon{
  width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;flex-shrink:0
}
.banner-icon svg{width:28px;height:28px;fill:#fff}
.banner-text{flex:1}
.banner-title{font-size:22px;font-weight:700;margin-bottom:2px}
.banner-sub{font-size:15px;opacity:.9}
.banner-badge{
  background:rgba(255,255,255,.2);backdrop-filter:blur(4px);padding:6px 16px;
  border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap;flex-shrink:0
}

/* ――― Grid ――― */
.grid{padding:24px;display:grid;grid-template-columns:1fr;gap:16px;flex:1}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:1024px){.grid{grid-template-columns:1fr 1fr 1fr;padding:32px;gap:20px}}

/* ――― Card ――― */
.card{
  background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:20px;transition:var(--transition);border:1px solid var(--border);
  display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden
}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;transition:var(--transition)}
.card.ok::before{background:var(--g400)}
.card.warn::before{background:var(--gold)}
.card.critical::before{background:var(--red)}
.card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.card-head{display:flex;align-items:center;gap:14px}
.card-icon{
  width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0
}
.card-icon svg{width:24px;height:24px}
.card-icon.telecom{background:var(--g50);fill:var(--g700)}
.card-icon.utility{background:var(--gold-l);fill:var(--gold-d)}
.card-name{font-size:17px;font-weight:600;flex:1}
.card-status{
  font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
  padding:3px 12px;border-radius:20px;white-space:nowrap
}
.card-status.ok{background:var(--g100);color:var(--g800)}
.card-status.warn{background:var(--gold-l);color:var(--gold-d)}
.card-status.critical{background:var(--red-l);color:var(--red-d)}
.card-body{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--text2)}
.card-body .row{display:flex;align-items:center;gap:8px}
.card-body .row svg{width:16px;height:16px;fill:var(--text3);flex-shrink:0}
.card-foot{font-size:12px;color:var(--text3);padding-top:8px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.card-foot .refreshing svg{width:14px;height:14px;fill:var(--text3);animation:spin 1s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.card-shimmer{position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);background-size:200% 100%;animation:shimmer 1.5s infinite;pointer-events:none}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

/* ――― Skeleton state ――― */
.skeleton .card::before{background:var(--border)}
.skeleton .card-icon{background:var(--bg)}
.skeleton .card-name{height:17px;background:var(--bg);border-radius:4px;width:60%}
.skeleton .card-status{width:70px;height:20px;background:var(--bg);border-radius:20px}
.skeleton .row{height:14px;background:var(--bg);border-radius:4px;width:70%}
.skeleton .row:nth-child(2){width:50%}
.skeleton .card-foot{height:12px;background:var(--bg);border-radius:4px;width:40%}

/* ――― Footer ――― */
.footer{
  text-align:center;padding:20px 24px;font-size:13px;color:var(--text3);
  border-top:1px solid var(--border);margin-top:auto
}
.footer .live-indicator{display:inline-flex;align-items:center;gap:6px;margin-bottom:4px}
.footer .live-dot{width:6px;height:6px;border-radius:50%;background:var(--g400);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ――― Error state ――― */
.error-state{
  text-align:center;padding:64px 24px;color:var(--text2);flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px
}
.error-state svg{width:48px;height:48px;fill:var(--text3)}
.error-state h2{font-size:20px;color:var(--text)}
.error-state p{font-size:14px;max-width:400px}
.error-state button{
  margin-top:8px;padding:10px 28px;border:none;border-radius:var(--radius-sm);
  background:var(--g700);color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:var(--transition)
}
.error-state button:hover{background:var(--g800);transform:translateY(-1px)}
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <div class="header-shield" aria-hidden="true">
      <svg viewBox="0 0 24 24"><title>Monitor Ipiranga</title><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
    </div>
    <div>
      <div class="header-title">Monitor <span>Ipiranga</span></div>
      <div style="font-size:12px;opacity:.7">Status dos serviços</div>
    </div>
  </div>
  <div class="header-right">
    <span class="header-time" id="headerTime" aria-live="polite">--:--</span>
    <span class="ov-dot ok" id="headerDot" role="img" aria-label="Status geral"></span>
  </div>
</header>

<div id="banner" class="banner ok" role="alert" aria-live="polite">
  <div class="banner-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24"><title>Status</title><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
  </div>
  <div class="banner-text">
    <div class="banner-title" id="bannerTitle">Tudo estável</div>
    <div class="banner-sub" id="bannerSub">Todos os serviços monitorados estão operando normalmente.</div>
  </div>
  <div class="banner-badge" id="bannerBadge">3 ok</div>
</div>

<section class="grid" id="grid" aria-label="Status dos serviços"></section>

<footer class="footer">
  <div class="live-indicator">
    <span class="live-dot"></span>
    <span id="liveLabel">Ao vivo</span>
  </div>
  <div id="footerTime">Atualizado há --s</div>
</footer>

<script>
const API_SERVICES='/api/services';
const API_STATUS='/api/status';
const REFRESH_MS=30000;
const SERVICE_META={
  Claro:{label:'Claro',icon:'signal',cat:'telecom',desc:'Portal do cliente'},
  Vivo:{label:'Vivo',icon:'signal',cat:'telecom',desc:'Portal do cliente'},
  TIM:{label:'TIM',icon:'signal',cat:'telecom',desc:'Portal do cliente'},
  Copel:{label:'Copel',icon:'bolt',cat:'utility',desc:'Energia elétrica'},
  Sanepar:{label:'Sanepar',icon:'water',cat:'utility',desc:'Abastecimento de água'}
};

const icons={
  signal:`<svg viewBox="0 0 24 24"><path d="M2 22h20V2L2 22zm18-2H6.83L20 6.83V20z"/></svg>`,
  bolt:`<svg viewBox="0 0 24 24"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.59-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/></svg>`,
  water:`<svg viewBox="0 0 24 24"><path d="M12 2c-5.33 4.55-8 8.48-8 11.8 0 4.98 3.8 8.2 8 8.2s8-3.22 8-8.2c0-3.32-2.67-7.25-8-11.8zM7.83 14H5.34c.23-2.69 1.99-5.73 4.66-8.44L10 5.5v4l-2.17 4.5z"/></svg>`,
  ok:`<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>`,
  warning:`<svg viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>`,
  error:`<svg viewBox="0 0 24 24"><path d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm5 13.59L15.59 17 12 13.41 8.41 17 7 15.59 10.59 12 7 8.41 8.41 7 12 10.59 15.59 7 17 8.41 13.41 12 17 15.59z"/></svg>`,
  spinner:`<svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>`
};

const $=(s)=>document.querySelector(s);
let lastFetch=0;

function fmtTime(ts){
  if(!ts)return'--:--';
  const d=new Date(ts);
  return d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function relativeTime(ts){
  if(!ts)return'--';const s=Math.floor((Date.now()-ts)/1000);
  if(s<5)return'agora';
  if(s<60)return`há ${s}s`;
  const m=Math.floor(s/60);
  if(m<60)return`há ${m}min`;
  return`há ${Math.floor(m/60)}h ${m%60}min`;
}

function updateClock(){
  $('#headerTime').textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

function updateBanner(level,ok,warn,crit){
  const bn=$('#banner'),t=$('#bannerTitle'),s=$('#bannerSub'),badge=$('#bannerBadge'),dot=$('#headerDot');
  bn.className='banner';
  const ico=bn.querySelector('.banner-icon');
  let label,sub;
  if(level==='critical'){
    bn.classList.add('critical');label='Serviço instável';
    sub='Um ou mais serviços estão apresentando problemas.';
    ico.innerHTML=icons.error;badge.textContent=`${crit} crítico`;
    dot.className='ov-dot critical';
  }else if(level==='warn'){
    bn.classList.add('warn');label='Atenção necessária';
    sub='Alguns serviços podem estar com latência elevada.';
    ico.innerHTML=icons.warning;badge.textContent=`${warn} alerta`;
    dot.className='ov-dot warn';
  }else{
    bn.classList.add('ok');label='Tudo estável';
    sub='Todos os serviços monitorados estão operando normalmente.';
    ico.innerHTML=icons.ok;badge.textContent=`${ok} ok`;
    dot.className='ov-dot ok';
  }
  t.textContent=label;s.textContent=sub;
}

function renderCards(services){
  const grid=$('#grid');
  if(!services||services.length===0){
    grid.innerHTML=`<div class="error-state" style="grid-column:1/-1">
      ${icons.error}
      <h2>Nenhum dado disponível</h2>
      <p>O monitoramento ainda não coletou informações. Aguarde a primeira verificação automática.</p>
    </div>`;
    return;
  }
  let html='';
  for(const svc of services){
    const name=svc.name;
    const meta=SERVICE_META[name]||{label:name,icon:'signal',cat:'telecom',desc:'Serviço'};
    const st=svc.status||'ok';
    const ico=icons[meta.icon]||icons.signal;
    const cat=meta.cat||'telecom';
    let detail='';
    if(name==='Copel'||name==='Sanepar'){
      detail=svc.details||'OK';
    }else if(svc.data?.portals){
      const p=svc.data.portals;
      if(p.length>0){
        const ok=p.filter(x=>x.success).length;
        const total=p.length;
        const avgLat=Math.round(p.reduce((a,x)=>a+(x.latencyMs||0),0)/total);
        detail=`${ok}/${total} portais ok · ${avgLat}ms`;
      }
    }
    html+=`<div class="card ${st}">
      <div class="card-head">
        <div class="card-icon ${cat}">${ico}</div>
        <div class="card-name">${meta.label}</div>
        <span class="card-status ${st}">${st==='ok'?'Normal':st==='warn'?'Atenção':'Crítico'}</span>
      </div>
      <div class="card-body">
        <div class="row">${icons.ok}
          <span>${meta.desc}${detail?`: ${detail}`:''}</span>
        </div>
        ${svc.data?.bgp?`<div class="row">${icons.signal}<span>AS${svc.data.bgp.asn} · ${svc.data.bgp.prefixCountV4||0} prefixos IPv4</span></div>`:''}
      </div>
      <div class="card-foot">
        <span>${fmtTime(svc.timestamp)}</span>
        <span>${relativeTime(svc.timestamp)}</span>
      </div>
    </div>`;
  }
  grid.innerHTML=html;
}

function setSkeleton(){
  const grid=$('#grid');
  let html='';
  for(const name of['Claro','Vivo','TIM','Copel','Sanepar']){
    html+=`<div class="card skeleton">
      <div class="card-head">
        <div class="card-icon telecom" style="width:44px;height:44px"></div>
        <div class="card-name"></div>
        <div class="card-status"></div>
      </div>
      <div class="card-body"><div class="row"></div><div class="row"></div></div>
      <div class="card-foot"></div>
    </div>`;
  }
  grid.innerHTML=html;
}

function showError(msg){
  const grid=$('#grid');
  grid.innerHTML=`<div class="error-state" style="grid-column:1/-1">
    ${icons.error}
    <h2>Falha ao carregar</h2>
    <p>${msg||'Não foi possível conectar ao servidor. Verifique sua conexão.'}</p>
    <button onclick="fetchData()">Tentar novamente</button>
  </div>`;
  $('#liveLabel').textContent='Offline';
  document.querySelector('.live-dot').style.background='var(--red)';
}

async function fetchData(){
  const now=Date.now();
  if(now-lastFetch<2000)return;
  lastFetch=now;
  setSkeleton();
  try{
    let resp=await fetch(API_SERVICES);
    if(!resp.ok)throw new Error(`HTTP ${resp.status}`);
    let data=await resp.json();
    if(!data.services||data.services.length===0){
      resp=await fetch(API_STATUS);
      if(!resp.ok)throw new Error(`HTTP ${resp.status}`);
      data=await resp.json();
      const services=[];
      for(const op of(data.operators||[])){
        const portals=op.portals||[];
        services.push({
          name:op.operator,
          status:op.status,
          timestamp:data.timestamp,
          data:{
            portals:portals,
            connectivity:op.connectivity||[],
            bgp:op.bgp||null
          }
        });
      }
      renderFromServices(services,data.level||'ok');
      return;
    }
    renderFromUnified(data);
  }catch(e){
    showError(e.message);
  }
}

function renderFromUnified(data){
  const services=data.services||[];
  let ok=0,warn=0,crit=0;
  const counts={};
  for(const s of services){
    counts[s.status]=counts[s.status]+1||1;
    if(s.status==='ok')ok++;else if(s.status==='warn')warn++;else crit++;
  }
  const level=data.overallStatus||(crit>0?'critical':warn>0?'warn':'ok');
  updateBanner(level,ok,warn,crit);
  renderCards(services);
  updateFooter(data.generatedAt);
  $('#liveLabel').textContent='Ao vivo';
  document.querySelector('.live-dot').style.background='var(--g400)';
}

function renderFromServices(services,level){
  let ok=0,warn=0,crit=0;
  for(const s of services){
    if(s.status==='ok')ok++;else if(s.status==='warn')warn++;else crit++;
  }
  updateBanner(level||'ok',ok,warn,crit);
  renderCards(services);
  updateFooter(Date.now());
  $('#liveLabel').textContent='Ao vivo';
  document.querySelector('.live-dot').style.background='var(--g400)';
}

function updateFooter(ts){
  if(!ts){$('#footerTime').textContent='Atualizado há --s';return}
  const tick=()=>{$('#footerTime').textContent=`Atualizado ${relativeTime(ts)}`};
  tick();if(window._footerTick)clearInterval(window._footerTick);
  window._footerTick=setInterval(tick,5000);
}

updateClock();
setInterval(updateClock,60000);
setSkeleton();
fetchData();
setInterval(fetchData,REFRESH_MS);
</script>
</body>
</html>
