<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor Ipiranga — Status dos Serviços</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --s900:#0F172A;--s700:#334155;--s600:#475569;--s400:#94A3B8;--s300:#CBD5E1;--s200:#E2E8F0;--s100:#F1F5F9;--s50:#F8FAFC;
  --g6:#16A34A;--g1:#DCFCE7;--g0:#F0FDF4;
  --a5:#F59E0B;--a1:#FEF3C7;--a0:#FFFBEB;
  --r6:#DC2626;--r1:#FEE2E2;--r0:#FEF2F2;
  --claro:#ED1C24;--vivo:#660099;--tim:#003DA5;--copel:#00923F;--sanepar:#003F87;
  --surface:#fff;--text:#0F172A;--text2:#475569;--text3:#94A3B8;--border:#E2E8F0;
  --radius:16px;--radius-sm:10px;--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --font:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif
}
html{font-size:16px;-webkit-font-smoothing:antialiased}
body{font-family:var(--font);background:var(--s50);color:var(--text);min-height:100dvh;display:flex;flex-direction:column}

/* Container centralizado */
.container{max-width:1200px;margin:0 auto;padding:0 24px;width:100%}

/* Header */
.header{
  background:linear-gradient(135deg,#1B5E20,#2E7D32);
  padding:16px 24px;color:#fff;display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 2px 12px rgba(0,0,0,.15);position:relative;z-index:10
}
.header-left{display:flex;align-items:center;gap:14px}
.header-shield{
  width:40px;height:40px;background:rgba(255,255,255,.15);border-radius:50%;
  display:flex;align-items:center;justify-content:center;flex-shrink:0
}
.header-shield svg{width:24px;height:24px;fill:#fff}
.header-title{font-size:20px;font-weight:700;letter-spacing:-.3px}
.header-title span{font-weight:400;opacity:.8}
.header-refresh-btn{
  display:flex;align-items:center;gap:10px;background:none;border:1px solid transparent;
  padding:6px 14px 6px 12px;border-radius:8px;cursor:pointer;color:#fff;
  font-family:var(--font);font-size:14px;transition:all .2s;user-select:none
}
.header-refresh-btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2)}
.header-refresh-btn:active{background:rgba(255,255,255,.15)}
.header-refresh-btn .ri{
  width:18px;height:18px;fill:#fff;flex-shrink:0;transition:transform .3s
}
.header-refresh-btn .ri.spinning{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.header-refresh-btn .ht{font-variant-numeric:tabular-nums;opacity:.85}
.ov-dot{width:10px;height:10px;border-radius:50%;transition:opacity .25s;flex-shrink:0}
.ov-dot.ok{background:var(--g6);box-shadow:0 0 8px var(--g6)}
.ov-dot.warn{background:var(--a5);box-shadow:0 0 8px var(--a5)}
.ov-dot.critical{background:var(--r6);box-shadow:0 0 8px var(--r6)}

/* Banner */
.banner{
  margin-top:24px;padding:20px 24px;border-radius:var(--radius);border-left:4px solid;
  display:flex;align-items:center;gap:16px;box-shadow:var(--shadow)
}
.banner.ok{background:var(--g0);border-color:var(--g6)}
.banner.warn{background:var(--a0);border-color:var(--a5)}
.banner.critical{background:var(--r0);border-color:var(--r6)}
.banner-icon{
  width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  background:var(--s100)
}
.banner-icon svg{width:22px;height:22px}
.banner.ok .banner-icon svg{fill:var(--g6)}
.banner.warn .banner-icon svg{fill:var(--a5)}
.banner.critical .banner-icon svg{fill:var(--r6)}
.banner-text{flex:1}
.banner-title{font-size:20px;font-weight:700;color:var(--text)}
.banner-sub{font-size:14px;color:var(--text2);margin-top:2px}
.banner-badge{
  padding:4px 14px;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap;flex-shrink:0;cursor:default
}
.banner.ok .banner-badge{background:var(--g1);color:var(--g6)}
.banner.warn .banner-badge{background:var(--a1);color:var(--a5)}
.banner.critical .banner-badge{background:var(--r1);color:var(--r6)}

/* Grid */
.grid{padding:24px 0;display:grid;grid-template-columns:1fr;gap:16px;flex:1}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:1024px){.grid{grid-template-columns:1fr 1fr 1fr;gap:20px}}

/* Card */
.card{
  background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
  display:flex;flex-direction:column;border:1px solid var(--border);overflow:hidden
}
.card-inner{padding:20px;display:flex;flex-direction:column;gap:12px}
.card-head{display:flex;align-items:center;gap:14px}
.card-icon{
  width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0
}
.card-icon svg{width:28px;height:28px}
.card-icon.claro{background:rgba(237,28,36,.1)}
.card-icon.claro svg{fill:var(--claro)}
.card-icon.vivo{background:rgba(102,0,153,.1)}
.card-icon.vivo svg{fill:var(--vivo)}
.card-icon.tim{background:rgba(0,61,165,.1)}
.card-icon.tim svg{fill:var(--tim)}
.card-icon.copel{background:rgba(0,146,63,.1)}
.card-icon.copel svg{fill:var(--copel)}
.card-icon.sanepar{background:rgba(0,63,135,.1)}
.card-icon.sanepar svg{fill:var(--sanepar)}
.card-name{font-size:18px;font-weight:700;flex:1}
.card-name .cb{
  font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;
  display:inline-block;margin-left:8px;padding:1px 8px;border-radius:4px;vertical-align:middle;cursor:default
}
.card-name .cb.telecom{background:rgba(237,28,36,.08);color:var(--claro)}
.card-name .cb.utility{background:rgba(0,146,63,.08);color:var(--copel)}
.card-status{
  font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
  padding:4px 14px;border-radius:20px;white-space:nowrap;cursor:default
}
.card-status.ok{background:var(--g1);color:var(--g6)}
.card-status.warn{background:var(--a1);color:var(--a5)}
.card-status.critical{background:var(--r1);color:var(--r6)}
.card-body{display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--text2)}
.card-body .row{display:flex;align-items:center;gap:8px}
.card-body .row svg{width:16px;height:16px;fill:var(--text3);flex-shrink:0}
.card-body .lat{
  font-size:22px;font-weight:700;color:var(--text);margin-top:2px
}
.card-body .lat span{font-size:13px;font-weight:400;color:var(--text3);margin-left:4px}
.card-body .lat.fast{color:var(--g6)}
.card-body .lat.slow{color:var(--a5)}
.card-foot{font-size:12px;color:var(--text3);padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:var(--s50)}

/* Skeleton */
.skeleton .card-icon{background:var(--s100)}
.skeleton .card-icon svg{display:none}
.skeleton .cb{display:none}
.skeleton .card-name{height:18px;background:var(--s100);border-radius:4px;width:50%}
.skeleton .card-status{width:80px;height:22px;background:var(--s100);border-radius:20px}
.skeleton .row{height:14px;background:var(--s100);border-radius:4px;width:70%}
.skeleton .row:nth-child(2){width:45%}
.skeleton .lat{height:22px;background:var(--s100);border-radius:4px;width:30%}
.skeleton .card-foot{height:12px;background:var(--s100);border-radius:4px;width:40%}

/* Footer */
.footer{
  text-align:center;padding:20px 24px;font-size:13px;color:var(--text3);border-top:1px solid var(--border);margin-top:auto;background:var(--surface)
}
.footer .li{display:inline-flex;align-items:center;gap:6px;margin-bottom:6px}
.footer .ld{width:6px;height:6px;border-radius:50%;background:var(--g6);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.footer .credit{font-size:12px;margin-top:4px}
.footer .credit strong{color:var(--text2)}

/* Error */
.error-state{
  text-align:center;padding:64px 24px;color:var(--text2);flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px
}
.error-state svg{width:48px;height:48px;fill:var(--text3)}
.error-state h2{font-size:20px;color:var(--text)}
.error-state p{font-size:14px;max-width:400px}
.error-state button{
  margin-top:8px;padding:10px 28px;border:none;border-radius:var(--radius-sm);
  background:var(--s700);color:#fff;font-size:14px;font-weight:600;cursor:pointer
}
.error-state button:hover{background:var(--s900)}
</style>
</head>
<body>
<header class="header">
  <div class="header-left">
    <div class="header-shield" aria-hidden="true">
      <svg viewBox="0 0 24 24"><title>Monitor Ipiranga</title><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
    </div>
    <div>
      <div class="header-title">Monitor <span>Ipiranga</span></div>
      <div style="font-size:12px;opacity:.7">Status dos serviços</div>
    </div>
  </div>
  <button class="header-refresh-btn" id="btnRefresh" type="button" aria-label="Atualizar dados do monitoramento" title="Clique para atualizar">
    <svg class="ri" id="refreshIcon" viewBox="0 0 24 24"><title>Recarregar</title><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    <span class="ht" id="headerTime" aria-live="polite">--:--</span>
    <span class="ov-dot ok" id="headerDot" role="img" aria-label="Status geral"></span>
  </button>
</header>

<div class="container">
  <div id="banner" class="banner ok" role="alert" aria-live="polite">
    <div class="banner-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><title>Estado geral</title><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
    </div>
    <div class="banner-text">
      <div class="banner-title" id="bannerTitle">Tudo estável</div>
      <div class="banner-sub" id="bannerSub">Todos os serviços monitorados estão operando normalmente.</div>
    </div>
    <div class="banner-badge" id="bannerBadge">3 ok</div>
  </div>

  <section class="grid" id="grid" aria-label="Status dos serviços"></section>
</div>

<footer class="footer">
  <div class="li">
    <span class="ld"></span>
    <span id="liveLabel">Ao vivo</span>
    <span style="margin:0 6px">·</span>
    <span id="footerTime">Atualizado há --s</span>
  </div>
  <div class="credit">Desenvolvido por <strong>Lucas Modesto</strong></div>
</footer>

<script>
const API_SERVICES='/api/services';
const API_STATUS='/api/status';
const REFRESH_MS=30000;
const BRANDS={
  Claro:{label:'Claro',cls:'claro',cat:'telecom',desc:'Rede móvel'},
  Vivo:{label:'Vivo',cls:'vivo',cat:'telecom',desc:'Rede móvel'},
  TIM:{label:'TIM',cls:'tim',cat:'telecom',desc:'Rede móvel'},
  Copel:{label:'Copel',cls:'copel',cat:'utility',desc:'Energia elétrica'},
  Sanepar:{label:'Sanepar',cls:'sanepar',cat:'utility',desc:'Abastecimento de água'}
};
const SVG=`<svg viewBox="0 0 24 24">`;
const ICON={
  claro:`${SVG}<path d="M2 22h20V2L2 22zm18-2H6.83L20 6.83V20z"/></svg>`,
  vivo:`${SVG}<path d="M2 22h20V2L2 22zm18-2H6.83L20 6.83V20z"/></svg>`,
  tim:`${SVG}<path d="M2 22h20V2L2 22zm18-2H6.83L20 6.83V20z"/></svg>`,
  copel:`${SVG}<path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.59-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/></svg>`,
  sanepar:`${SVG}<path d="M12 2c-5.33 4.55-8 8.48-8 11.8 0 4.98 3.8 8.2 8 8.2s8-3.22 8-8.2c0-3.32-2.67-7.25-8-11.8zM7.83 14H5.34c.23-2.69 1.99-5.73 4.66-8.44L10 5.5v4l-2.17 4.5z"/></svg>`,
  ok:`${SVG}<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>`,
  warning:`${SVG}<path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>`,
  error:`${SVG}<path d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm5 13.59L15.59 17 12 13.41 8.41 17 7 15.59 10.59 12 7 8.41 8.41 7 12 10.59 15.59 7 17 8.41 13.41 12 17 15.59z"/></svg>`,
  bolt:`${SVG}<path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>`,
  check:`${SVG}<path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>`,
  clock:`${SVG}<path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>`
};

const $=(s)=>document.querySelector(s);
let lastFetch=0;

function fmtTime(ts){
  if(!ts)return'--:--';
  return new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function relativeTime(ts){
  if(!ts)return'--';const s=Math.floor((Date.now()-ts)/1000);
  if(s<5)return'agora';
  if(s<60)return`há ${s}s`;
  const m=Math.floor(s/60);
  if(m<60)return`há ${m}min`;
  return`há ${Math.floor(m/60)}h ${m%60}min`;
}
function updateClock(){
  const now=new Date();
  $('#headerTime').textContent=now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function latencyClass(ms){
  if(ms===null||ms===undefined)return'';
  if(ms<100)return'fast';
  if(ms<500)return'';
  return'slow';
}

function updateBanner(level,ok,warn,crit){
  const bn=$('#banner'),t=$('#bannerTitle'),s=$('#bannerSub'),badge=$('#bannerBadge'),dot=$('#headerDot');
  bn.className='banner';
  if(level==='critical'){
    bn.classList.add('critical');t.textContent='Serviço instável';
    s.textContent='Um ou mais serviços estão apresentando problemas.';badge.textContent=`${crit} crítico`;
    dot.className='ov-dot critical';
  }else if(level==='warn'){
    bn.classList.add('warn');t.textContent='Atenção necessária';
    s.textContent='Alguns serviços podem estar com latência elevada.';badge.textContent=`${warn} alerta`;
    dot.className='ov-dot warn';
  }else{
    bn.classList.add('ok');t.textContent='Tudo estável';
    s.textContent='Todos os serviços monitorados estão operando normalmente.';badge.textContent=`${ok} ok`;
    dot.className='ov-dot ok';
  }
}

function renderCards(services){
  const grid=$('#grid');
  if(!services||services.length===0){
    grid.innerHTML=`<div class="error-state" style="grid-column:1/-1">
      ${ICON.error}<h2>Nenhum dado disponível</h2>
      <p>O monitoramento ainda não coletou informações. Aguarde a primeira verificação automática.</p>
    </div>`;
    return;
  }
  let html='';
  for(const svc of services){
    const name=svc.name;
    const br=BRANDS[name]||{label:name,cls:'claro',cat:'telecom',desc:'Serviço'};
    const st=svc.status||'ok';
    const ico=ICON[br.cls]||ICON.claro;
    const stLabel=st==='ok'?'Normal':st==='warn'?'Atenção':'Crítico';
    let perPortals='',latency='',latCls='',bgpLine='',detailLine='',portalsFail=0;

    if(svc.data?.portals){
      const p=svc.data.portals;
      if(p.length>0){
        const success=p.filter(x=>x.success);
        portalsFail=p.length-success.length;
        const avg=success.length>0?Math.round(success.reduce((a,x)=>a+(x.latencyMs||0),0)/success.length):null;
        perPortals=`${success.length}/${p.length}`;
        if(avg!==null){latency=`${avg}`;latCls=latencyClass(avg);}
      }
    }
    if(br.cat==='utility'){
      detailLine=svc.details||'OK';
      latency='—';
    }
    const hasLatency=latency&&latency!=='—';
    let connOk=0,connTotal=0;
    if(svc.data?.connectivity){
      connOk=svc.data.connectivity.filter(x=>x.success).length;
      connTotal=svc.data.connectivity.length;
    }
    if(svc.data?.bgp){
      const b=svc.data.bgp;
      bgpLine=`<div class="row">${ICON.clock}<span>AS${b.asn} · Faixas IPv4: ${b.prefixCountV4||0} · IPv6: ${b.prefixCountV6||0}</span></div>`;
    }

    html+=`<div class="card">
      <div class="card-inner">
        <div class="card-head">
          <div class="card-icon ${br.cls}">${ico}</div>
          <div class="card-name">${br.label}<span class="cb ${br.cat}">${br.cat==='telecom'?'Telefonia':'Utilidade'}</span></div>
          <span class="card-status ${st}">${stLabel}</span>
        </div>
        <div class="card-body">
          <div class="row">${ICON.check}<span>${br.desc}</span></div>
          ${br.cat==='telecom'&&perPortals?`<div class="row">${ICON.bolt}<span>Portais: ${perPortals}${portalsFail>0?` (${portalsFail} falha${portalsFail>1?'s':''})`:''}</span></div>`:''}
          ${detailLine?`<div class="row">${ICON.ok}<span>${detailLine}</span></div>`:''}
          ${bgpLine}
          ${hasLatency?`<div class="lat ${latCls}">${latency} <span>ms de latência média</span></div>`:''}
          ${connTotal>0?`<div class="row">${ICON.ok}<span>Conectividade: ${connOk}/${connTotal} ok</span></div>`:''}
        </div>
        <div class="card-foot">
          <span>${fmtTime(svc.timestamp)}</span>
          <span>${relativeTime(svc.timestamp)}</span>
        </div>
      </div>
    </div>`;
  }
  grid.innerHTML=html;
}

function setSkeleton(){
  const grid=$('#grid');
  let html='';
  for(const name of['Claro','Vivo','TIM','Copel','Sanepar']){
    const cls=BRANDS[name].cls;
    html+=`<div class="card skeleton">
      <div class="card-inner">
        <div class="card-head">
          <div class="card-icon ${cls}"></div>
          <div class="card-name"></div>
          <div class="card-status"></div>
        </div>
        <div class="card-body"><div class="row"></div><div class="row"></div><div class="lat"></div></div>
        <div class="card-foot"></div>
      </div>
    </div>`;
  }
  grid.innerHTML=html;
}

function showError(msg){
  const grid=$('#grid');
  grid.innerHTML=`<div class="error-state" style="grid-column:1/-1">
    ${ICON.error}<h2>Falha ao carregar</h2>
    <p>${msg||'Não foi possível conectar ao servidor. Verifique sua conexão.'}</p>
    <button onclick="fetchData()">Tentar novamente</button>
  </div>`;
  $('#liveLabel').textContent='Offline';
  $('.ld').style.background='var(--r6)';
}

async function fetchData(){
  if(Date.now()-lastFetch<2000)return;
  lastFetch=Date.now();
  const ri=$('#refreshIcon');
  ri.classList.add('spinning');
  setSkeleton();
  try{
    let resp=await fetch(API_SERVICES);
    if(!resp.ok)throw new Error(`HTTP ${resp.status}`);
    let data=await resp.json();
    if(!data.services||data.services.length===0){
      resp=await fetch(API_STATUS);
      if(!resp.ok)throw new Error(`HTTP ${resp.status}`);
      data=await resp.json();
      const services=[];
      for(const op of(data.operators||[])){
        services.push({
          name:op.operator,status:op.status,
          timestamp:data.timestamp,
          data:{portals:op.portals||[],connectivity:op.connectivity||[],bgp:op.bgp||null}
        });
      }
      renderFromServices(services,data.level||'ok');return;
    }
    renderFromUnified(data);
  }catch(e){showError(e.message)}
  finally{ri.classList.remove('spinning')}
}

function renderFromUnified(data){
  const services=data.services||[];
  let ok=0,warn=0,crit=0;
  for(const s of services){
    if(s.status==='ok')ok++;else if(s.status==='warn')warn++;else crit++;
  }
  const level=data.overallStatus||(crit>0?'critical':warn>0?'warn':'ok');
  updateBanner(level,ok,warn,crit);
  renderCards(services);
  updateFooter(data.generatedAt);
  $('.ld').style.background='var(--g6)';
  $('#liveLabel').textContent='Ao vivo';
}

function renderFromServices(services,level){
  let ok=0,warn=0,crit=0;
  for(const s of services){
    if(s.status==='ok')ok++;else if(s.status==='warn')warn++;else crit++;
  }
  updateBanner(level||'ok',ok,warn,crit);
  renderCards(services);
  updateFooter(Date.now());
  $('.ld').style.background='var(--g6)';
  $('#liveLabel').textContent='Ao vivo';
}

function updateFooter(ts){
  if(!ts){$('#footerTime').textContent='Atualizado há --s';return}
  const tick=()=>{$('#footerTime').textContent=`Atualizado ${relativeTime(ts)}`};
  tick();if(window._footerTick)clearInterval(window._footerTick);
  window._footerTick=setInterval(tick,5000);
}

document.getElementById('btnRefresh').addEventListener('click',fetchData);

updateClock();
setInterval(updateClock,60000);
setSkeleton();
fetchData();
setInterval(fetchData,REFRESH_MS);
</script>
</body>
</html>
