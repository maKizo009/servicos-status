name: radar-monitor

on:
  schedule:
    # Leituras do radar a cada 10 min (cadência dos frames do RainViewer)
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  trigger-vercel-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispara /api/cron na Vercel
        shell: bash
        run: |
          URL="https://servicos-status.vercel.app/api/cron"
          echo "==> POST $URL"
          for attempt in 1 2 3; do
            HTTP_CODE=$(curl -s -o /tmp/cron_resp.txt -w "%{http_code}" -m 120 \
              -X POST "$URL" \
              -H "Content-Type: application/json" \
              -d '{"source":"github-actions"}')
            echo "    tentativa $attempt: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "==> Cron executado com sucesso"
              cat /tmp/cron_resp.txt
              exit 0
            fi
            echo "    resposta: $(head -c 200 /tmp/cron_resp.txt)"
            sleep 15
          done
          echo "==> FAIL: /api/cron não respondeu 200 após 3 tentativas" >&2
          exit 1
